<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Yangın bölmesi, koridor ve kaçış yolu</title>
  <desc id="desc">Yangın kompartımanı sınırı, net kaçış koridoru, kapılar ve güvenli çıkışı birlikte gösteren teknik plan şeması.</desc>
  <rect width="1600" height="900" fill="#0f172a"/>
  <rect x="70" y="70" width="1460" height="760" rx="28" fill="#111827" stroke="#475569" stroke-width="4"/>
  <text x="120" y="150" fill="#f8fafc" font-family="Arial, sans-serif" font-size="52" font-weight="700">Yangın Bölmesi · Koridor · Kaçış Yolu</text>
  <text x="120" y="205" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="26">Kompartıman sürekliliği ile kullanıcı akışını aynı plan üzerinde kontrol et</text>

  <rect x="130" y="285" width="430" height="370" rx="20" fill="#1f2937" stroke="#fb923c" stroke-width="7"/>
  <text x="180" y="345" fill="#fed7aa" font-family="Arial, sans-serif" font-size="30" font-weight="700">YANGIN KOMPARTIMANI</text>
  <line x1="560" y1="285" x2="560" y2="655" stroke="#fb923c" stroke-width="16"/>
  <circle cx="560" cy="470" r="18" fill="#0f172a" stroke="#fde68a" stroke-width="5"/>
  <text x="180" y="420" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="25">Duvar + döşeme + kapı</text>
  <text x="180" y="465" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="25">+ penetrasyon sürekliliği</text>
  <text x="180" y="545" fill="#fdba74" font-family="Arial, sans-serif" font-size="24">≥ 60 dk temel sınır</text>

  <rect x="650" y="330" width="520" height="280" rx="26" fill="#172554" stroke="#60a5fa" stroke-width="5"/>
  <text x="710" y="390" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="30" font-weight="700">NET KAÇIŞ KORİDORU</text>
  <path d="M720 490 H1080" fill="none" stroke="#f8fafc" stroke-width="18" stroke-linecap="round"/>
  <path d="M1050 455 L1110 490 L1050 525" fill="none" stroke="#f8fafc" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="815" y1="440" x2="815" y2="540" stroke="#93c5fd" stroke-width="5" stroke-dasharray="12 10"/>
  <line x1="945" y1="440" x2="945" y2="540" stroke="#93c5fd" stroke-width="5" stroke-dasharray="12 10"/>
  <text x="710" y="575" fill="#dbeafe" font-family="Arial, sans-serif" font-size="23">Daralma noktalarını gerçek net açıklıkla ölç</text>

  <rect x="1240" y="360" width="220" height="220" rx="20" fill="#052e16" stroke="#4ade80" stroke-width="6"/>
  <text x="1280" y="430" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="27" font-weight="700">GÜVENLİ</text>
  <text x="1292" y="466" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="27" font-weight="700">ÇIKIŞ</text>
  <path d="M1300 520 H1400 M1360 485 L1405 520 L1360 555" fill="none" stroke="#86efac" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M575 470 H635" fill="none" stroke="#facc15" stroke-width="10" stroke-linecap="round"/>
  <path d="M1170 470 H1220" fill="none" stroke="#facc15" stroke-width="10" stroke-linecap="round"/>

  <rect x="125" y="715" width="1350" height="70" rx="16" fill="#1e293b"/>
  <text x="165" y="758" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24">Kullanıcı yükü → net güzergâh → darboğaz kontrolü → kompartıman sürekliliği → güvenli çıkış</text>
</svg>