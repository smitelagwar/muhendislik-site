name: CAD distance Stage 6 gate

on:
  push:
    branches:
      - internal-cad-measurement-stage6
    paths:
      - ".github/workflows/cad-distance-stage6.yml"
      - "scripts/check-cad-distance-stage6.ts"
      - "src/components/dokumantasyon/preview/cad-distance-overlay.tsx"
      - "src/components/dokumantasyon/preview/cad-upstream-viewer.tsx"
      - "src/lib/dokumantasyon/cad-upstream/adapter.ts"
      - "src/lib/dokumantasyon/cad-upstream/distance-measurement.ts"
      - "src/lib/dokumantasyon/cad-upstream/snap-*.ts"
      - "vercel.json"
  pull_request:
    paths:
      - ".github/workflows/cad-distance-stage6.yml"
      - "scripts/check-cad-distance-stage6.ts"
      - "src/components/dokumantasyon/preview/cad-distance-overlay.tsx"
      - "src/components/dokumantasyon/preview/cad-upstream-viewer.tsx"
      - "src/lib/dokumantasyon/cad-upstream/adapter.ts"
      - "src/lib/dokumantasyon/cad-upstream/distance-measurement.ts"
      - "src/lib/dokumantasyon/cad-upstream/snap-*.ts"
      - "vercel.json"

concurrency:
  group: cad-distance-stage6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-distance-measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Run Stage 6 distance contract gate
        run: npx tsx scripts/check-cad-distance-stage6.ts

      - name: Targeted Stage 6 lint
        run: >-
          npx eslint
          "src/lib/dokumantasyon/cad-upstream/distance-measurement.ts"
          "src/lib/dokumantasyon/cad-upstream/adapter.ts"
          "src/components/dokumantasyon/preview/cad-distance-overlay.tsx"
          "src/components/dokumantasyon/preview/cad-upstream-viewer.tsx"
          "scripts/check-cad-distance-stage6.ts"

      - name: Typecheck site
        run: npx tsc --noEmit --incremental false

      - name: Production-equivalent Next build
        run: npm run build
