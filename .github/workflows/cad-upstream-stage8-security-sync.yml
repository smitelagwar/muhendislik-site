name: CAD upstream Stage 8 security sync

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/cad-upstream-migration-stage8.md

permissions:
  contents: write

concurrency:
  group: cad-upstream-stage8-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-safe-transitive-overrides:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node.js matching production
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply narrow security overrides
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const file = 'package.json'
          const p = JSON.parse(fs.readFileSync(file, 'utf8'))
          p.overrides ??= {}
          p.overrides.tar = '7.5.22'
          p.overrides['lodash-es'] = '4.18.1'
          fs.writeFileSync(file, JSON.stringify(p, null, 2) + '\n')
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Install overridden dependency graph
        run: npm ci

      - name: Verify production audit removes release blockers
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > stage8-security-audit.json || true
          node <<'NODE'
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('stage8-security-audit.json','utf8'))
          const counts = report.metadata?.vulnerabilities ?? {}
          const vulnerabilities = report.vulnerabilities ?? {}
          console.log('post-override production audit:', JSON.stringify(counts))
          if ((counts.critical ?? 0) !== 0) throw new Error(`critical vulnerabilities remain: ${counts.critical}`)
          if (vulnerabilities['lodash-es']) throw new Error('lodash-es advisory remains after override')
          if (vulnerabilities['@mlightcad/cad-simple-viewer']) throw new Error('MLightCAD advisory remains after lodash-es override')
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'))
          const tar = lock.packages?.['node_modules/tar']?.version
          const lodashEs = lock.packages?.['node_modules/lodash-es']?.version
          if (tar !== '7.5.22') throw new Error(`tar lock mismatch: ${tar}`)
          if (lodashEs !== '4.18.1') throw new Error(`lodash-es lock mismatch: ${lodashEs}`)
          console.log(`security overrides PASS tar=${tar} lodash-es=${lodashEs}`)
          NODE

      - name: Re-run CAD contracts
        run: |
          node scripts/sync-cad-upstream-assets.mjs
          node scripts/check-cad-upstream-stage6.mjs
          node scripts/check-cad-upstream-stage7.mjs
          node scripts/check-cad-upstream-stage8.mjs

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Production build
        run: npm run build

      - name: Commit verified package and lock overrides
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "Security overrides already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(security): pin safe CAD release transitives"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
