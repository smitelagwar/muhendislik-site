name: CAD upstream Stage 3 lock sync

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write

jobs:
  sync-package-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Recompute package lock only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit deterministic lockfile update
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(cad): sync MLightCAD dependency lock"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
