name: dok-mobile-plan-validation

on:
  push:
    branches:
      - main
      - internal-dok-mobile-plan-no-deploy
  pull_request:
    paths:
      - "src/components/dokumantasyon/**"
      - "src/app/dokumantasyon/**"
      - "src/components/navbar*.tsx"
      - "src/components/global-overlays.tsx"
      - "src/app/layout.tsx"
      - "src/app/globals.css"
      - "tests/dok-drive-v3/**"
      - "scripts/check-dok-drive-v3-*"
      - "playwright.dok-drive.config.ts"
      - "tsconfig.dok-mobile.json"
      - "package*.json"
      - ".github/workflows/dok-mobile-plan-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dok-mobile-plan-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Mobile runtime lint
        run: npx eslint src/components/dokumantasyon/mobile-*.tsx src/components/dokumantasyon/drive-v3/use-workspace-history.ts src/components/dokumantasyon/drive-v3/workspace-session.tsx src/components/dokumantasyon/upload-progress-toast.tsx tests/dok-drive-v3/mobile-*.spec.ts playwright.dok-drive.config.ts
      - run: npx tsc --noEmit --incremental false -p tsconfig.dok-mobile.json
      - run: npm run check:dok-drive-v3:static

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium-390, compact-mobile-chromium-320, mobile-webkit-iphone13]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.dok-drive.config.ts --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dok-mobile-${{ matrix.project }}
          path: test-results/dok-drive-v3
          retention-days: 7

  # Preserve the required check name; all independent gates must pass.
  validate-mobile-documents:
    if: always()
    needs: [static, browsers]
    runs-on: ubuntu-latest
    steps:
      - name: All gates must succeed
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
        run: test "$STATIC_RESULT" = success && test "$BROWSER_RESULT" = success
