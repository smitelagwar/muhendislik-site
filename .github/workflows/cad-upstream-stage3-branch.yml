name: CAD upstream Stage 3 branch gate

on:
  push:
    branches:
      - feat/cad-upstream-transplant
    paths:
      - package.json
      - package-lock.json
      - scripts/sync-cad-upstream-assets.mjs
      - scripts/check-cad-upstream-stage3.mjs
      - src/lib/dokumantasyon/cad-upstream/**
      - docs/cad-upstream-migration-stage3.md
      - .github/workflows/cad-upstream-stage3-branch.yml

permissions:
  contents: read

concurrency:
  group: cad-upstream-stage3-branch
  cancel-in-progress: true

jobs:
  verify-stage3-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact root lockfile
        run: npm ci --ignore-scripts

      - name: Sync upstream worker assets
        run: node scripts/sync-cad-upstream-assets.mjs

      - name: Run Stage 3 contract gate
        run: node scripts/check-cad-upstream-stage3.mjs

      - name: Typecheck adapter and site
        run: npx tsc --noEmit --incremental false

      - name: Ensure frozen production CAD surface is untouched
        shell: bash
        run: |
          git fetch origin main --depth=1
          git diff --exit-code origin/main...HEAD -- \
            src/components/dokumantasyon/preview/cad-viewer.tsx \
            src/components/dokumantasyon/preview/dxf-viewer-worker.ts \
            src/components/dokumantasyon/preview/dwg-dxf-conversion-worker.ts \
            src/components/dokumantasyon/preview/aps-dwg-viewer.tsx \
            src/lib/dokumantasyon/dwg

# This branch-only gate exists so Stage 3 verification is independent of pull-request queue state.
