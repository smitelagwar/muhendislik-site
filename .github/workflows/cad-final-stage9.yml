name: CAD final Stage 9 release gate

on:
  push:
    branches:
      - internal-cad-final-stage9
  pull_request:
    paths:
      - ".github/workflows/cad-final-stage9.yml"
      - "scripts/check-cad-stage9-release.ts"
      - "scripts/check-cad-review-release.ts"
      - "scripts/verify-cad-stage8-a11y-performance.mjs"
      - "src/components/dokumantasyon/preview/cad-*.tsx"
      - "src/components/dokumantasyon/preview/cad-ribbon/**"
      - "src/lib/dokumantasyon/cad-review/**"
      - "src/lib/dokumantasyon/cad-upstream/**"
      - "tests/document-studio/cad-*.spec.ts"
      - "playwright.config.ts"
      - "vercel.json"
      - ".vercelignore"

permissions:
  contents: write

concurrency:
  group: cad-final-stage9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Merge current main into release candidate
        id: merge_main
        shell: bash
        run: |
          git fetch origin main --no-tags
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "did_merge=false" >> "$GITHUB_OUTPUT"
            echo "Current main is already integrated."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git merge --no-ff -X ours origin/main -m "merge(main): integrate Stage 9 production candidate"
            echo "did_merge=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Repair known CAD integration hunks
        env:
          DID_MERGE: ${{ steps.merge_main.outputs.did_merge }}
        run: |
          node scripts/repair-cad-stage9-merge.mjs
          node scripts/repair-cad-stage9-mouse-bindings.mjs
          git add -A
          if ! git diff --cached --quiet; then
            if [ "$DID_MERGE" = "true" ]; then
              git commit --amend --no-edit
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "fix(cad): repair Stage 9 integration hunks"
            fi
          fi
          git status --short

      - name: Install exact lockfile
        run: npm ci

      - name: Stage 9 deterministic blocker oracle
        run: npx tsx scripts/check-cad-stage9-release.ts

      - name: Stage 8 accessibility and performance regression gate
        run: node scripts/verify-cad-stage8-a11y-performance.mjs

      - name: Install Chromium for release browser gates
        run: npx playwright install --with-deps chromium

      - name: Stage 9 Golden Paths — Pen, Area, Calibration
        env:
          PLAYWRIGHT_PRODUCTION_SERVER: "1"
          PLAYWRIGHT_PORT: "3031"
        run: npx playwright test tests/document-studio/cad-stage9-release.spec.ts --project=chromium

      - name: CAD Preview V2 regression matrix
        env:
          PLAYWRIGHT_PRODUCTION_SERVER: "1"
          PLAYWRIGHT_PORT: "3032"
        run: npm run check:cad-preview-v2

      - name: Composite CAD Review release gate
        env:
          PLAYWRIGHT_PRODUCTION_SERVER: "1"
          PLAYWRIGHT_PORT: "3033"
        run: npm run check:cad-review:release

      - name: Full repository lint
        run: npm run lint

      - name: Final TypeScript noEmit
        run: npx tsc --noEmit --incremental false

      - name: Final production-equivalent build
        run: npm run build

      - name: Conflict and whitespace guard
        run: git diff --check

      - name: Push exact tested integration commit
        if: github.event_name == 'push'
        run: git push origin HEAD:internal-cad-final-stage9

      - name: Upload final browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-final-stage9-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
