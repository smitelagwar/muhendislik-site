name: TBDY 3B Duzensizlik Studio E2E
on:
  pull_request:
    paths:
      - "src/components/duzensizlik-simulatoru/**"
      - "src/lib/duzensizlik-simulatoru/**"
      - "src/components/site-shell.tsx"
      - "src/app/kategori/araclar/duzensizlik-simulatoru/**"
      - "tests/site-audit/irregularity-studio.spec.ts"
      - "tests/duzensizlik-simulatoru/**"
      - ".github/workflows/duzensizlik-simulatoru-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build / geometry / desktop / mobile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Install locked dependencies
        run: npm ci
      - name: Lint changed simulator
        run: npx eslint src/components/duzensizlik-simulatoru src/lib/duzensizlik-simulatoru tests/site-audit/irregularity-studio.spec.ts tests/duzensizlik-simulatoru
      - name: Typecheck
        run: npx tsc -p tsconfig.next.json --noEmit --incremental false
      - name: Pure geometry tests
        run: npx tsx --test tests/duzensizlik-simulatoru/*.test.ts
      - name: Production build
        run: npm run build
      - name: Install browser runtimes
        run: npx playwright install --with-deps chromium webkit
      - name: Chromium desktop and mobile + WebKit mobile
        env: { PLAYWRIGHT_PRODUCTION_SERVER: "1" }
        run: >
          npx playwright test --config=playwright.site.config.ts
          tests/site-audit/irregularity-studio.spec.ts
          --project=chromium-desktop-1366
          --project=chromium-mobile-390
          --project=chromium-mobile-320
          --project=chromium-tablet-768
          --project=webkit-mobile-390
      - name: Upload visual and failure reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: irregularity-quality-evidence
          path: |
            test-results/site-audit
            playwright-report/site-audit
          retention-days: 7
          if-no-files-found: ignore
