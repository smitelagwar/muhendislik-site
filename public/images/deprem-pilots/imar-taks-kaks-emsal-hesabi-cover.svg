<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#ecfdf5"/><text x="65" y="85" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#047857">İMAR · PARSEL · EMSAL</text><text x="65" y="140" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a">TAKS · KAKS · Emsal</text><g transform="translate(100 220)"><rect width="430" height="300" fill="#fff" stroke="#64748b" stroke-width="5"/><rect x="95" y="65" width="240" height="160" fill="#a7f3d0" stroke="#047857" stroke-width="5"/><text x="215" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#065f46">TABAN</text><text x="215" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#065f46">A × TAKS</text></g><g transform="translate(650 215)" fill="#d1fae5" stroke="#047857" stroke-width="4"><rect x="0" y="240" width="360" height="65"/><rect x="25" y="170" width="310" height="65"/><rect x="50" y="100" width="260" height="65"/><rect x="75" y="30" width="210" height="65"/></g><text x="830" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#065f46">Toplam emsal alanı = A × KAKS</text><text x="600" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#475569">Taban oturumu ile katlar boyunca biriken emsal alanı iki ayrı kontroldür.</text></svg>