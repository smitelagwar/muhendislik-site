<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title>Bina önem katsayısı açıklama şeması</title><desc>Bina önem katsayısı açıklama şeması</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#12A9C6" /></marker><marker id="arrowN" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#123B63" /></marker><style>.bg{fill:#FFFFFF}.panel{fill:#F8FBFC;stroke:#DDE8EE;stroke-width:2;rx:28}.frame{fill:none;stroke:#123B63;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#123B63;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.cyan{fill:none;stroke:#12A9C6;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.cyanThin{fill:none;stroke:#12A9C6;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.solidN{fill:#123B63}.solidC{fill:#12A9C6}.softC{fill:#E8F8FB;stroke:#12A9C6;stroke-width:3}.softN{fill:#EEF4F7;stroke:#123B63;stroke-width:3}.txt{font-family:Arial,Helvetica,sans-serif;fill:#19324a;font-size:34px;font-weight:600}.small{font-family:Arial,Helvetica,sans-serif;fill:#19324a;font-size:26px;font-weight:600}.tiny{font-family:Arial,Helvetica,sans-serif;fill:#19324a;font-size:22px;font-weight:500}.label{font-family:Arial,Helvetica,sans-serif;fill:#123B63;font-size:26px;font-weight:700}.cap{font-family:Arial,Helvetica,sans-serif;fill:#123B63;font-size:44px;font-weight:700}.muted{stroke:#93A8B8;stroke-width:3;fill:none;stroke-dasharray:8 8}.warn{fill:#C74F4F;stroke:#C74F4F;stroke-width:3}</style></defs><rect class="bg" x="0" y="0" width="1600" height="900"/><text x="170" y="120" class="cap">Kullanım Amacından Katsayı Kararına</text><rect x="100" y="300" width="330" height="180" class="panel"/><text x="126" y="350" class="txt">Kullanım A