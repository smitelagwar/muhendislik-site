name: CAD upstream Stage 6 latest parser probe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cad-upstream-transplant
    paths:
      - .github/workflows/cad-upstream-stage6-probe.yml
      - docs/cad-upstream-migration-stage6.md

permissions:
  contents: read

concurrency:
  group: cad-upstream-stage6-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-latest-parser-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pack exact latest converter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/package
          cd probe
          npm pack @mlightcad/libredwg-converter@3.14.2 --silent > tarball.txt
          tar -xzf "$(cat tarball.txt)" -C package --strip-components=1

      - name: Verify parser artifact contract
        shell: bash
        run: |
          set -euo pipefail
          test -s probe/package/dist/libredwg-parser-worker.js
          test -s probe/package/dist/libredwg-web.wasm
          node -e 'const p=require("./probe/package/package.json"); if(p.version!=="3.14.2") process.exit(1)'
          printf '%s\n' \
            'converter=@mlightcad/libredwg-converter@3.14.2' \
            'expected-libredwg-web=0.7.10' \
            "worker-bytes=$(stat -c%s probe/package/dist/libredwg-parser-worker.js)" \
            "wasm-bytes=$(stat -c%s probe/package/dist/libredwg-web.wasm)" \
            > probe/stage6-probe-manifest.txt
          cat probe/stage6-probe-manifest.txt

      - name: Assemble private-corpus probe artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage6-parser-probe
          cp probe/package/dist/libredwg-parser-worker.js stage6-parser-probe/
          cp probe/package/dist/libredwg-web.wasm stage6-parser-probe/
          cp probe/package/package.json stage6-parser-probe/converter-package.json
          cp probe/stage6-probe-manifest.txt stage6-parser-probe/

      - name: Upload parser probe
        uses: actions/upload-artifact@v4
        with:
          name: cad-upstream-stage6-libredwg-3.14.2
          path: stage6-parser-probe/
          if-no-files-found: error
          retention-days: 3
