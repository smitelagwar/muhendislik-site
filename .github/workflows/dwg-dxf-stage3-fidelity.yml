name: dwg-dxf-stage3-fidelity

on:
  push:
    branches:
      - feat/dwg-dxf-stage3-fidelity-cache
    paths:
      - "src/lib/dokumantasyon/dwg/**"
      - "src/lib/dokumantasyon/db.ts"
      - "src/lib/dokumantasyon/types.ts"
      - "src/lib/dokumantasyon/local-store.ts"
      - "src/lib/dokumantasyon/runtime-mode.ts"
      - "scripts/check-dwg-dxf-stage3-fidelity.ts"
      - ".github/workflows/dwg-dxf-stage3-fidelity.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "src/lib/dokumantasyon/dwg/**"
      - "src/lib/dokumantasyon/db.ts"
      - "src/lib/dokumantasyon/types.ts"
      - "src/lib/dokumantasyon/local-store.ts"
      - "src/lib/dokumantasyon/runtime-mode.ts"
      - "scripts/check-dwg-dxf-stage3-fidelity.ts"
      - ".github/workflows/dwg-dxf-stage3-fidelity.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dwg-dxf-stage3-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fidelity-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js matching Vercel production
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from exact lock
        run: npm ci

      - name: Fetch pinned DWG fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .poc/stage3-fixtures artifacts/dwg-dxf-stage3-fidelity
          BASE="https://raw.githubusercontent.com/node-projects/acad-ts/15b87c1ca2784fca623c44a6836f723e77411fd8/samples"
          for VERSION in AC1014 AC1032; do
            curl --fail --location --retry 3 --retry-delay 2 \
              "${BASE}/sample_${VERSION}.dwg" \
              --output ".poc/stage3-fixtures/sample_${VERSION}.dwg"
          done
          sha256sum .poc/stage3-fixtures/*.dwg | tee artifacts/dwg-dxf-stage3-fidelity/fixture-sha256.txt

      - name: Targeted lint
        run: npx eslint "src/lib/dokumantasyon/dwg/**/*.ts" "src/lib/dokumantasyon/db.ts" "src/lib/dokumantasyon/types.ts" "src/lib/dokumantasyon/local-store.ts" "scripts/check-dwg-dxf-stage3-fidelity.ts"

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Structural fidelity and cache release check
        shell: bash
        env:
          DWG_STAGE3_FIXTURE_DIR: .poc/stage3-fixtures
        run: |
          set -o pipefail
          npx tsx scripts/check-dwg-dxf-stage3-fidelity.ts | tee artifacts/dwg-dxf-stage3-fidelity/release-check.txt

      - name: Browser core must remain server-free
        shell: bash
        run: |
          npm install --no-save --package-lock=false esbuild@0.25.9
          npx esbuild src/lib/dokumantasyon/dwg/index.ts \
            --bundle \
            --format=esm \
            --platform=browser \
            --target=es2022 \
            --keep-names \
            --outfile=.poc/dwg-dxf-stage3-browser-core.js \
            --metafile=artifacts/dwg-dxf-stage3-fidelity/browser-bundle-meta.json
          if grep -Eq 'node:fs|node:path|@vercel/blob' .poc/dwg-dxf-stage3-browser-core.js; then
            echo "Server-only dependency leaked into DWG browser core." >&2
            exit 1
          fi
          stat -c 'Stage 3 browser core: %s bytes' .poc/dwg-dxf-stage3-browser-core.js | tee artifacts/dwg-dxf-stage3-fidelity/browser-bundle-size.txt

      - name: Upload Stage 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dwg-dxf-stage3-fidelity-${{ github.sha }}
          path: artifacts/dwg-dxf-stage3-fidelity/
          if-no-files-found: error
          retention-days: 14