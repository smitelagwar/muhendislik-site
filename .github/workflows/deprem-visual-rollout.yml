name: deprem-visual-rollout

on:
  push:
    branches:
      - internal-deprem-visual-refresh-20260826
  pull_request:
    branches:
      - main

jobs:
  technical-visual-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment freeze
        run: node scripts/check-vercel-deployment-freeze.mjs

      - name: Verify phased visual rollout
        run: npx tsx scripts/check-deprem-visual-rollout.ts

      - name: Verify technical SVG quality
        run: npx tsx scripts/check-deprem-technical-svg.ts

      - name: TypeScript
        run: npx tsc --noEmit
