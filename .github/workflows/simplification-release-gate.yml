name: Simplification Release Gate

on:
  push:
    branches:
      - internal-site-release-gate-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      DOK_STORAGE_MODE: "local"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Full simplification release gate
        run: npm run check:simplification-stage7
