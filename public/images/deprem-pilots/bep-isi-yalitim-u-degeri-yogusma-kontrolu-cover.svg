<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7fee7"/><text x="65" y="85" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#4d7c0f">TS 825:2024 · ISI YALITIMI</text><text x="65" y="140" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a">U Değeri ve Yoğuşma</text><g transform="translate(110 220)"><rect x="0" y="0" width="120" height="300" fill="#e2e8f0"/><rect x="120" y="0" width="100" height="300" fill="#d9f99d"/><rect x="220" y="0" width="180" height="300" fill="#bef264"/><rect x="400" y="0" width="120" height="300" fill="#e2e8f0"/><g stroke="#b91c1c" stroke-width="8"><path d="M-20 150h570"/><polygon points="560,150 530,130 530,170" fill="#b91c1c"/></g></g><g font-family="Arial,sans-serif" fill="#334155"><text x="710" y="265" font-size="28">R_T = R_si + Σ(d/λ) + R_se</text><text x="710" y="330" font-size="34" font-weight="700" fill="#4d7c0f">U = 1 / R_T</text><text x="710" y="390" font-size="22">ısı akışı → sıcaklık profili</text><text x="710" y="435" font-size="22">buhar basıncı → yoğuşma kontrolü</text></g><text x="600" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#475569">Güncel proje değerleri yürürlükteki TS 825 ve Bakanlık Isı Yalıtım Raporu ile doğrulanmalıdır.</text></svg>