name: dwg-dxf-stage4-orchestration

on:
  push:
    branches:
      - feat/dwg-dxf-stage4-orchestration
    paths:
      - ".github/workflows/dwg-dxf-stage4-orchestration.yml"
      - "package.json"
      - "scripts/build-dwg-dxf-worker.mjs"
      - "scripts/check-dwg-dxf-stage4-orchestration.ts"
      - "src/components/dokumantasyon/preview/aps-dwg-viewer.tsx"
      - "src/components/dokumantasyon/preview/dwg-dxf-conversion-worker.ts"
      - "src/app/api/dokumantasyon/files/[id]/dwg-dxf/route.ts"
      - "src/lib/dokumantasyon/dwg/**"
  pull_request:
    paths:
      - ".github/workflows/dwg-dxf-stage4-orchestration.yml"
      - "package.json"
      - "scripts/build-dwg-dxf-worker.mjs"
      - "scripts/check-dwg-dxf-stage4-orchestration.ts"
      - "src/components/dokumantasyon/preview/aps-dwg-viewer.tsx"
      - "src/components/dokumantasyon/preview/dwg-dxf-conversion-worker.ts"
      - "src/app/api/dokumantasyon/files/[id]/dwg-dxf/route.ts"
      - "src/lib/dokumantasyon/dwg/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dwg-dxf-stage4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js matching Vercel production
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from exact lock
        run: npm ci

      - name: Targeted lint
        run: >-
          npx eslint
          "src/components/dokumantasyon/preview/aps-dwg-viewer.tsx"
          "src/components/dokumantasyon/preview/dwg-dxf-conversion-worker.ts"
          "src/app/api/dokumantasyon/files/[id]/dwg-dxf/route.ts"
          "src/lib/dokumantasyon/dwg/**/*.ts"
          "scripts/check-dwg-dxf-stage4-orchestration.ts"

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Orchestration contract
        run: npx tsx scripts/check-dwg-dxf-stage4-orchestration.ts

      - name: Generate positive binary DWG fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/__dwg-stage4
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            ACadVersion,
            CadDocument,
            DwgWriter,
            Line,
            Point,
            XYZ,
          } from '@node-projects/acad-ts';

          const document = new CadDocument();
          document.header.version = ACadVersion.AC1014;
          if (!document.entities) throw new Error('Synthetic document entity collection is unavailable.');
          document.entities.add(new Point(new XYZ(10, 5, 0)));
          document.entities.add(new Line(new XYZ(0, 0, 0), new XYZ(50, 30, 0)));
          const buffer = new ArrayBuffer(4 * 1024 * 1024);
          const writer = new DwgWriter(buffer, document);
          writer.write();
          if (!writer.bytesWritten) throw new Error('Synthetic DWG writer produced no bytes.');
          fs.writeFileSync(
            'public/__dwg-stage4/simple_AC1014.dwg',
            new Uint8Array(buffer, 0, writer.bytesWritten)
          );
          console.log(`Fixture bytes: ${writer.bytesWritten}`);
          NODE

      - name: Generate ephemeral Worker probe page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/app/dwg-stage4-worker-probe
          cat > src/app/dwg-stage4-worker-probe/page.tsx <<'TSX'
          "use client";

          import { useEffect, useState } from "react";
          import { DWG_DXF_WORKER_ASSET_URL } from "@/lib/dokumantasyon/dwg/signature";

          interface WorkerResult {
            requestId?: string;
            ok?: boolean;
            decision?: "PASS" | "WARN" | "REJECT";
            dxfBytes?: number;
            errorCode?: string;
            errorMessage?: string;
          }

          export default function Stage4WorkerProbePage() {
            const [state, setState] = useState("pending");
            const [result, setResult] = useState<WorkerResult | null>(null);

            useEffect(() => {
              let active = true;
              let worker: Worker | null = null;
              const timer = window.setTimeout(() => {
                worker?.terminate();
                if (active) {
                  setState("timeout");
                  setResult({ errorCode: "PROBE_TIMEOUT", errorMessage: "Production DWG worker timed out." });
                }
              }, 20_000);

              const run = async () => {
                try {
                  const response = await fetch("/__dwg-stage4/simple_AC1014.dwg", { cache: "no-store" });
                  if (!response.ok) throw new Error(`Fixture fetch failed: ${response.status}`);
                  const buffer = await response.arrayBuffer();
                  if (!active) return;

                  worker = new Worker(DWG_DXF_WORKER_ASSET_URL, { type: "module" });
                  worker.onerror = (event) => {
                    window.clearTimeout(timer);
                    worker?.terminate();
                    if (!active) return;
                    setState("worker-error");
                    setResult({ errorCode: "WORKER_EVENT_ERROR", errorMessage: event.message || "Worker error" });
                  };
                  worker.onmessage = (event: MessageEvent<WorkerResult>) => {
                    window.clearTimeout(timer);
                    worker?.terminate();
                    if (!active) return;
                    setResult(event.data);
                    setState(event.data.ok ? "success" : "worker-result-error");
                  };
                  worker.postMessage({ requestId: "stage4-ci", buffer }, [buffer]);
                } catch (error) {
                  window.clearTimeout(timer);
                  worker?.terminate();
                  if (!active) return;
                  setState("exception");
                  setResult({ errorCode: "PROBE_EXCEPTION", errorMessage: error instanceof Error ? error.message : String(error) });
                }
              };

              void run();
              return () => {
                active = false;
                window.clearTimeout(timer);
                worker?.terminate();
              };
            }, []);

            return (
              <main>
                <pre id="result" data-state={state}>{JSON.stringify(result)}</pre>
              </main>
            );
          }
          TSX

      - name: Production build with stable Worker prebuild
        run: npm run build

      - name: Verify stable production Worker asset
        shell: bash
        run: |
          set -euo pipefail
          WORKER="public/workers/dwg-dxf-conversion-worker.js"
          test -f "$WORKER"
          SIZE="$(stat -c '%s' "$WORKER")"
          if [ "$SIZE" -lt 100000 ]; then
            echo "Stable DWG Worker is unexpectedly small: ${SIZE} bytes"
            exit 1
          fi
          grep -q 'WORKER_CLASS_NAME_CONTRACT_FAILED' "$WORKER"
          echo "Stable Worker asset: ${SIZE} bytes"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production Worker runtime fidelity check
        shell: bash
        run: |
          set -euo pipefail
          PORT=3012 npm start > /tmp/dwg-stage4-next.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:3012/dwg-stage4-worker-probe" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/dwg-stage4-next.log
              exit 1
            fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            const browserErrors = [];
            page.on('console', (message) => {
              if (message.type() === 'error' || message.type() === 'warning') {
                browserErrors.push(`${message.type()}: ${message.text()}`);
              }
            });
            page.on('pageerror', (error) => browserErrors.push(`pageerror: ${error.message}`));

            await page.goto('http://127.0.0.1:3012/dwg-stage4-worker-probe', { waitUntil: 'domcontentloaded' });
            await page.locator('#result').waitFor({ state: 'attached' });
            await page.waitForFunction(() => {
              const node = document.querySelector('#result');
              return node && node.getAttribute('data-state') !== 'pending';
            }, null, { timeout: 25_000 });

            const state = await page.locator('#result').getAttribute('data-state');
            const text = await page.locator('#result').textContent();
            const result = text ? JSON.parse(text) : null;
            console.log({ state, result, browserErrors });

            assert.equal(state, 'success', `Stable Worker probe failed: ${JSON.stringify({ state, result, browserErrors })}`);
            assert.equal(result.requestId, 'stage4-ci');
            assert.equal(result.ok, true, `Worker failed: ${result.errorCode || ''} ${result.errorMessage || ''}`);
            assert.ok(result.decision === 'PASS' || result.decision === 'WARN');
            assert.ok(result.dxfBytes > 0);
            assert.notEqual(result.errorCode, 'WORKER_CLASS_NAME_CONTRACT_FAILED');
          } finally {
            await browser.close();
          }
          NODE

      - name: Remove ephemeral Stage 4 probe
        if: always()
        run: rm -rf public/__dwg-stage4 src/app/dwg-stage4-worker-probe
