<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="55" y="70" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">1.000 m² parsel · aritmetik örnek</text><g transform="translate(85 135)" font-family="Arial,sans-serif"><rect width="430" height="380" fill="#f8fafc" stroke="#64748b" stroke-width="4"/><rect x="75" y="70" width="280" height="200" fill="#a7f3d0" stroke="#047857" stroke-width="5"/><text x="215" y="155" text-anchor="middle" font-size="24" fill="#065f46">TAKS 0,30</text><text x="215" y="195" text-anchor="middle" font-size="30" font-weight="700" fill="#065f46">300 m²</text><text x="215" y="335" text-anchor="middle" font-size="20" fill="#475569">parsel oturumu hesabı</text></g><g transform="translate(650 135)" font-family="Arial,sans-serif"><g fill="#d1fae5" stroke="#047857" stroke-width="4"><rect x="0" y="285" width="400" height="70"/><rect x="25" y="210" width="350" height="70"/><rect x="50" y="135" width="300" height="70"/><rect x="75" y="60" width="250" height="70"/></g><text x="200" y="25" text-anchor="middle" font-size="24" fill="#065f46">Emsal 1,50</text><text x="200" y="395" text-anchor="middle" font-size="30" font-weight="700" fill="#065f46">1.500 m²</text></g><rect x="80" y="570" width="1040" height="55" rx="12" fill="#fff7ed"/><text x="600" y="605" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#9a3412">Bu sonuç imar hakkı taahhüdü değildir: plan notu, çekme mesafesi, yükseklik ve diğer mevzuat ayrıca kontrol edilir.</text></svg>