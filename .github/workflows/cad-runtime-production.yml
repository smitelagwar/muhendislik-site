name: cad-runtime-production

on:
  pull_request:
    paths:
      - ".github/workflows/cad-runtime-production.yml"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "playwright.config.ts"
      - "scripts/check-dokumantasyon-persistence-rules.mjs"
      - "src/components/dokumantasyon/preview/cad-viewer.tsx"
      - "src/components/dokumantasyon/preview/cad-runtime-orchestrator.tsx"
      - "src/components/dokumantasyon/preview/cad-upstream-viewer.tsx"
      - "src/components/dokumantasyon/preview/dwg-legacy-conversion-fallback.tsx"
      - "src/components/dokumantasyon/preview/aps-only-dwg-viewer.tsx"
      - "src/components/dokumantasyon/preview/dxf-diagnostics-panel.tsx"
      - "src/components/dokumantasyon/preview/dxf-viewer-worker.ts"
      - "src/components/dokumantasyon/preview/dwg-dxf-conversion-worker.ts"
      - "src/lib/dokumantasyon/cad-runtime/**"
      - "src/lib/dokumantasyon/cad-upstream/**"
      - "src/lib/dokumantasyon/dxf-*.ts"
      - "src/lib/dokumantasyon/dwg/**"
      - "src/lib/dokumantasyon/runtime-mode.ts"
      - "tests/document-studio/cad-dxf.spec.ts"
      - "tests/document-studio/cad-dwg-aps.spec.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cad-runtime-production.yml"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "playwright.config.ts"
      - "scripts/check-dokumantasyon-persistence-rules.mjs"
      - "src/components/dokumantasyon/preview/cad-viewer.tsx"
      - "src/components/dokumantasyon/preview/cad-runtime-orchestrator.tsx"
      - "src/components/dokumantasyon/preview/cad-upstream-viewer.tsx"
      - "src/components/dokumantasyon/preview/dwg-legacy-conversion-fallback.tsx"
      - "src/components/dokumantasyon/preview/aps-only-dwg-viewer.tsx"
      - "src/components/dokumantasyon/preview/dxf-diagnostics-panel.tsx"
      - "src/components/dokumantasyon/preview/dxf-viewer-worker.ts"
      - "src/components/dokumantasyon/preview/dwg-dxf-conversion-worker.ts"
      - "src/lib/dokumantasyon/cad-runtime/**"
      - "src/lib/dokumantasyon/cad-upstream/**"
      - "src/lib/dokumantasyon/dxf-*.ts"
      - "src/lib/dokumantasyon/dwg/**"
      - "src/lib/dokumantasyon/runtime-mode.ts"
      - "tests/document-studio/cad-dxf.spec.ts"
      - "tests/document-studio/cad-dwg-aps.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cad-runtime-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-runtime:
    name: CAD production runtime gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js matching Vercel production
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Targeted CAD runtime lint
        run: >-
          npx eslint
          "src/components/dokumantasyon/preview/cad-viewer.tsx"
          "src/components/dokumantasyon/preview/cad-runtime-orchestrator.tsx"
          "src/components/dokumantasyon/preview/cad-upstream-viewer.tsx"
          "src/components/dokumantasyon/preview/dwg-legacy-conversion-fallback.tsx"
          "src/components/dokumantasyon/preview/aps-only-dwg-viewer.tsx"
          "src/components/dokumantasyon/preview/dxf-diagnostics-panel.tsx"
          "src/components/dokumantasyon/preview/dxf-viewer-worker.ts"
          "src/lib/dokumantasyon/cad-runtime/io.ts"
          "src/lib/dokumantasyon/cad-upstream/adapter.ts"
          "src/lib/dokumantasyon/dxf-runtime-policy.ts"
          "src/lib/dokumantasyon/runtime-mode.ts"
          "scripts/check-dokumantasyon-persistence-rules.mjs"
          "tests/document-studio/cad-dxf.spec.ts"
          "tests/document-studio/cad-dwg-aps.spec.ts"

      - name: Full typecheck
        run: npx tsc --noEmit --incremental false

      - name: Persistence and production-test isolation
        run: npx tsx scripts/check-dokumantasyon-persistence-rules.mjs

      - name: Production Next build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production CAD browser gate
        env:
          PLAYWRIGHT_PRODUCTION_SERVER: "1"
          PLAYWRIGHT_PORT: "3018"
        run: >-
          npx playwright test --config=playwright.config.ts
          tests/document-studio/cad-dxf.spec.ts
          tests/document-studio/cad-dwg-aps.spec.ts
          --project=chromium

      - name: Upload production CAD evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cad-production-runtime-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
