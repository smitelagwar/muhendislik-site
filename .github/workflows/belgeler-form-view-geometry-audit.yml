name: belgeler-form-view-geometry-audit
on:
  push:
    branches: [internal-belgeler-geometry-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install OS input tool for true Chrome browser zoom
        run: sudo apt-get install -y xdotool
      - name: Real app DOM geometry and breakpoint tests
        id: cssgeometry
        env:
          CI: "true"
          PLAYWRIGHT_PRODUCTION_SERVER: "0"
        run: npx playwright test --config=playwright.site.config.ts tests/site-audit/belgeler-form-geometry-audit.spec.ts --project=chromium-desktop-1920 --reporter=line
        continue-on-error: true
      - name: Mobile, keyboard, modal and ready-state browser probes
        id: interaction
        env:
          CI: "true"
          PLAYWRIGHT_PRODUCTION_SERVER: "0"
        run: npx playwright test --config=playwright.site.config.ts tests/site-audit/belgeler-stage03-gap.spec.ts tests/site-audit/belgeler-modal-isolation-audit.spec.ts --project=chromium-desktop-1920 --reporter=line
        continue-on-error: true
      - name: TRUE Chrome UI zoom via OS keyboard (not emulation/pageScaleFactor)
        id: nativezoom
        env:
          CI: "true"
          PLAYWRIGHT_PRODUCTION_SERVER: "0"
        run: xvfb-run -a -s "-screen 0 2400x1400x24" npx playwright test --config=playwright.site.config.ts tests/site-audit/belgeler-native-chrome-zoom.spec.ts --headed --project=chromium-desktop-1920 --reporter=line
        continue-on-error: true
      - name: Form manual zoom, density, long input and focus edge matrix
        id: stress
        env:
          CI: "true"
          PLAYWRIGHT_PRODUCTION_SERVER: "0"
        run: npx playwright test --config=playwright.site.config.ts tests/site-audit/belgeler-stage03-stress.spec.ts --project=chromium-desktop-1920 --reporter=line
        continue-on-error: true
      - name: Z01-Z08 true Chrome window+zoom matrix
        id: p0matrix
        env:
          CI: "true"
          PLAYWRIGHT_PRODUCTION_SERVER: "0"
        run: xvfb-run -a -s "-screen 0 2400x1400x24" npx playwright test --config=playwright.site.config.ts tests/site-audit/belgeler-stage03-p0-native.spec.ts --headed --project=chromium-desktop-1920 --reporter=line
        continue-on-error: true
      - name: Upload results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belgeler-form-geometry-and-native-zoom-report
          path: |
            test-results/
            playwright-report/
            audit-artifacts-native-zoom/
            audit-artifacts-stage03-gaps/
            audit-artifacts-stage03-stress/
            audit-artifacts-stage03-p0/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce audit gates after both suites
        if: always()
        run: |
          echo 'CSS outcome: ${{ steps.cssgeometry.outcome }}'
          echo 'Native zoom outcome: ${{ steps.nativezoom.outcome }}'
          test '${{ steps.cssgeometry.outcome }}' = 'success' && test '${{ steps.nativezoom.outcome }}' = 'success' && test '${{ steps.interaction.outcome }}' = 'success' && test '${{ steps.stress.outcome }}' = 'success' && test '${{ steps.p0matrix.outcome }}' = 'success'
