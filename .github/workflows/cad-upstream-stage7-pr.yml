name: CAD upstream Stage 7 cleanup gate

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/cad-upstream-migration-stage7.md
      - scripts/check-cad-upstream-stage7.mjs
      - src/components/dokumantasyon/preview/cad-viewer.tsx
      - src/components/dokumantasyon/preview/aps-dwg-viewer.tsx
      - src/components/dokumantasyon/preview/cad-runtime-orchestrator.tsx
      - src/components/dokumantasyon/preview/cad-upstream-viewer.tsx
      - src/components/dokumantasyon/preview/dwg-legacy-conversion-fallback.tsx
      - src/components/dokumantasyon/preview/aps-only-dwg-viewer.tsx
      - src/components/dokumantasyon/preview/file-preview-shell.tsx

permissions:
  contents: read

concurrency:
  group: cad-upstream-stage7-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-stage7-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact root lockfile
        run: npm ci --ignore-scripts

      - name: Sync upstream worker assets
        run: node scripts/sync-cad-upstream-assets.mjs

      - name: Re-run Stage 6 fidelity contract
        run: node scripts/check-cad-upstream-stage6.mjs

      - name: Run Stage 7 cleanup ownership gate
        run: node scripts/check-cad-upstream-stage7.mjs

      - name: Targeted lint
        run: >-
          npx eslint
          src/lib/dokumantasyon/cad-upstream/adapter.ts
          src/components/dokumantasyon/preview/cad-runtime-orchestrator.tsx
          src/components/dokumantasyon/preview/cad-upstream-viewer.tsx
          src/components/dokumantasyon/preview/cad-viewer.tsx
          src/components/dokumantasyon/preview/dwg-legacy-conversion-fallback.tsx
          src/components/dokumantasyon/preview/aps-only-dwg-viewer.tsx
          src/components/dokumantasyon/preview/file-preview-shell.tsx

      - name: Typecheck site
        run: npx tsc --noEmit --incremental false

      - name: Production build
        run: npm run build

      - name: Enforce historical Stage 7 scope or current Stage 8 ownership
        shell: bash
        env:
          STAGE7_BASELINE: ca86b5d27971d97add065c506baea8f3ba62c6c9
          STAGE7_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -f scripts/check-cad-upstream-stage8.mjs ]; then
            node scripts/check-cad-upstream-stage7.mjs
            echo "Stage 7 fixed scope superseded by Stage 8 release scope: PASS"
            exit 0
          fi
          git fetch origin "${STAGE7_HEAD}" --depth=1
          mapfile -t changed < <(git diff --name-only "${STAGE7_BASELINE}..${STAGE7_HEAD}")
          printf 'Stage 7 changed files:\n%s\n' "${changed[*]}"
          for file in "${changed[@]}"; do
            case "$file" in
              src/components/dokumantasyon/preview/cad-viewer.tsx|\
              src/components/dokumantasyon/preview/aps-dwg-viewer.tsx|\
              scripts/check-cad-upstream-stage7.mjs|\
              docs/cad-upstream-migration-stage7.md)
                ;;
              *)
                echo "Stage 7 scope violation: $file"
                exit 1
                ;;
            esac
          done
          echo "Stage 7 application scope: PASS"
