name: belgeler-final-validation

on:
  pull_request:
    paths:
      - ".github/workflows/belgeler-final-validation.yml"
      - "src/components/belgeler-hub.tsx"
      - "src/components/*-studio.tsx"
      - "src/lib/belge-studio-pdf-actions.ts"
      - "src/lib/document-field-contracts.ts"
      - "src/lib/documents-data.ts"
      - "tests/belgeler/**"
      - "tests/site-audit/belgeler-mobile-studio.spec.ts"
      - "playwright.site.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Full repository lint (historical debt is informational)
        run: npm run lint
        continue-on-error: true
      - name: Full TypeScript
        run: npx tsc --noEmit --incremental false
        continue-on-error: true
      - name: Deployable TypeScript
        run: npx tsc -p tsconfig.next.json --noEmit --incremental false
      - name: Build before production-server Playwright gates
        run: npm run build
      - name: Belgeler targeted Playwright
        run: npx playwright test --config=playwright.site.config.ts tests/site-audit/belgeler-mobile-studio.spec.ts
      - name: Site E2E
        run: npm run check:site-e2e
      - name: Site accessibility
        run: npm run check:site-a11y
      - name: Production build
        run: npm run build
      - name: Smoke
        run: npm run check:smoke
