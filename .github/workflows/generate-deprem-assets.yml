name: Generate deprem visual assets

on:
  push:
    branches:
      - deprem-assets-generate

permissions:
  contents: write

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout generator branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve generator
        shell: bash
        run: cp scripts/generate-deprem-visual-assets.py /tmp/generate-deprem-visual-assets.py

      - name: Generate and commit assets on main
        id: generate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            git fetch origin main
            git checkout -B main origin/main
            python /tmp/generate-deprem-visual-assets.py "$PWD"
            git add public/deprem-visual
            TARGET_COUNT="$(find public/deprem-visual -type f -name '*.svg' | wc -l | tr -d ' ')"
            echo "Repository SVG count after generation: $TARGET_COUNT"
            test "$TARGET_COUNT" -ge 286
            CHANGED_COUNT="$(git diff --cached --name-only | grep '^public/deprem-visual/.*\.svg$' | wc -l | tr -d ' ')"
            echo "Changed SVG files: $CHANGED_COUNT"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git diff --cached --quiet; then
              echo "No asset changes required."
              exit 0
            fi
            git commit -m "feat(deprem-visual): add remaining non-TS500 visual assets"
            git push origin main
          } 2>&1 | tee /tmp/generator-run.log

      - name: Upload generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-diagnostics
          path: /tmp/generator-run.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail workflow when generation failed
        if: steps.generate.outcome == 'failure'
        shell: bash
        run: exit 1
