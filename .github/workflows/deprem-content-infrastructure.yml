name: Deprem Content Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - audit/faz0-deprem-inventory-20260825
    paths:
      - .github/workflows/deprem-content-infrastructure.yml
      - src/components/article-client.tsx
      - src/lib/article-blocks.ts
      - src/lib/articles-data.ts
      - src/lib/content-author.ts
      - scripts/check-deprem-content.ts
      - scripts/check-deprem-infrastructure.ts
      - scripts/check-navigation.mjs
      - package.json

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: deprem-infrastructure-source-${{ github.sha }}
          path: |
            src/components/article-client.tsx
            src/lib/article-blocks.ts
            src/lib/articles-data.ts
            src/lib/deprem-series.ts
            scripts/check-deprem-content.ts
            scripts/check-navigation.mjs
            package.json
          retention-days: 3
      - run: npm ci
      - name: Infrastructure check
        shell: bash
        run: |
          if npm run | grep -q "check:deprem-infrastructure"; then
            npm run check:deprem-infrastructure
          else
            echo "Bootstrap run: check:deprem-infrastructure is not defined yet."
          fi
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Full deprem quality debt report
        continue-on-error: true
        run: npm run check:deprem-content
