name: Deprem Content Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - audit/faz0-deprem-inventory-20260825
      - internal-*
    paths:
      - .github/workflows/deprem-content-infrastructure.yml
      - .agents/rules/deprem-icerik-kurallari.md
      - public/images/deprem-pilots/**
      - src/app/deprem-visual/**
      - src/components/article-client.tsx
      - src/components/deprem/AraclarGrid.tsx
      - src/lib/article-blocks.ts
      - src/lib/articles-data.ts
      - src/lib/content-author.ts
      - src/lib/deprem-phase3-articles.ts
      - src/lib/deprem-phase3-*.ts
      - src/lib/deprem-pilot-articles.ts
      - src/lib/deprem-rollout.ts
      - src/lib/deprem-rollout-extra.ts
      - src/lib/deprem-series.ts
      - src/lib/deprem-topic-articles.ts
      - src/lib/deprem-visual.ts
      - scripts/check-deprem-content.ts
      - scripts/check-deprem-infrastructure.ts
      - scripts/check-deprem-phase3.ts
      - scripts/check-deprem-phase3-render.mjs
      - scripts/check-deprem-phase3-batch6-render.mjs
      - scripts/check-deprem-phase3-batch7-render.mjs
      - scripts/check-deprem-pilots.ts
      - scripts/check-deprem-rollout.ts
      - scripts/generate-deprem-content-inventory.ts
      - package.json

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: FAZ 3 technical content contract
        run: npx tsx scripts/check-deprem-phase3.ts
      - name: Deprem infrastructure contract
        run: npm run check:deprem-infrastructure
      - name: FAZ 2 pilot content contract
        run: npx tsx scripts/check-deprem-pilots.ts
      - name: Deprem rollout contract
        run: npx tsx scripts/check-deprem-rollout.ts
      - name: Deprem source-of-truth inventory
        run: npx tsx scripts/generate-deprem-content-inventory.ts --out=deprem-content-inventory.ci.json
      - name: Strict deprem content gate
        run: npm run check:deprem-content
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: FAZ 3 responsive render QA
        run: node scripts/check-deprem-phase3-render.mjs
      - name: FAZ 3 batch 6 responsive render QA
        run: node scripts/check-deprem-phase3-batch6-render.mjs
      - name: FAZ 3 batch 7 responsive render QA
        run: node scripts/check-deprem-phase3-batch7-render.mjs
