name: CAD upstream Stage 3 package sync

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/cad-upstream-migration-stage3.md

permissions:
  contents: write

jobs:
  sync-package-contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact Stage 3 package contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'package.json'
          const p = JSON.parse(fs.readFileSync(path, 'utf8'))
          p.scripts ??= {}
          p.dependencies ??= {}
          p.scripts.predev = 'node scripts/build-dwg-dxf-worker.mjs && node scripts/sync-cad-upstream-assets.mjs'
          p.scripts.prebuild = 'node scripts/build-dwg-dxf-worker.mjs && node scripts/sync-cad-upstream-assets.mjs'
          p.scripts['check:cad-upstream:stage3'] = 'node scripts/check-cad-upstream-stage3.mjs'
          p.dependencies['@mlightcad/cad-simple-viewer'] = '1.6.0'
          p.dependencies['@mlightcad/data-model'] = '1.13.0'
          p.dependencies['@mlightcad/libredwg-converter'] = '3.13.0'
          fs.writeFileSync(path, JSON.stringify(p, null, 2) + '\n')
          NODE

      - name: Recompute package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit package contract
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Stage 3 package contract already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(cad): add pinned MLightCAD Stage 3 dependencies"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
