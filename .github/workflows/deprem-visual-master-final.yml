name: Deprem Visual Master Final
on:
  push:
    branches: [main]
    paths:
      - "public/deprem-visual/**"
      - "src/lib/ts500-content/**"
      - "src/lib/ts500-visual-rollout.ts"
      - "scripts/check-deprem-visual-master-final.ts"
      - ".github/workflows/deprem-visual-master-final.yml"
permissions:
  contents: read
jobs:
  master-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Master 164 topic / 328 asset QA
        run: npx tsx scripts/check-deprem-visual-master-final.ts
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Production build
        run: npm run build
      - name: Full deprem release gate
        run: npm run check:deprem-release
