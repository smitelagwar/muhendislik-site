name: Belgeler production PWA diagnostic
on:
  push:
    branches: [hotfix/belgeler-pwa-live-prep-diagnostics-20261029]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/diag-belgeler-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-belgeler-preparation
          path: test-results/live-prep
