name: dwg-dxf-lockgen

on:
  push:
    branches:
      - feat/dwg-dxf-auto-preview
    paths:
      - ".github/workflows/dwg-dxf-lockgen.yml"
  pull_request:
    paths:
      - ".github/workflows/dwg-dxf-lockgen.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate exact dependency lock
        run: npm install --package-lock-only --save-exact @node-projects/acad-ts@2.4.0

      - name: Verify lock
        shell: bash
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies['@node-projects/acad-ts']!=='2.4.0') process.exit(1)"
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/@node-projects/acad-ts']?.version!=='2.4.0') process.exit(1)"

      - name: Commit generated manifests to benchmark branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Manifest files are already up to date."
            exit 0
          fi
          git commit -m "build(dwg): pin acad-ts 2.4.0 for preview benchmark"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload generated manifests
        uses: actions/upload-artifact@v4
        with:
          name: dwg-dxf-lockgen-${{ github.sha }}
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 2
