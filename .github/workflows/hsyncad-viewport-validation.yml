name: hsynCAD responsive viewport gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hsyncad-viewport-validation.yml"
      - "src/components/hsyncad/**"
      - "src/components/site-shell.tsx"
      - "src/components/global-overlays.tsx"
      - "src/app/kategori/araclar/hsyncad/**"
      - "tests/hsyncad/**"
      - "playwright.hsyncad.config.ts"

permissions:
  contents: read

concurrency:
  group: hsyncad-viewport-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  chromium-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout proposed CAD branch
        uses: actions/checkout@v4
      - name: Setup Node matching production
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install pinned dependencies
        run: npm ci
      - name: Targeted lint
        run: npx eslint src/components/hsyncad src/components/site-shell.tsx src/components/global-overlays.tsx tests/hsyncad
      - name: Typecheck deployable runtime
        run: npx tsc --noEmit --incremental false -p tsconfig.next.json
      - name: Verify runner's preinstalled Chrome browser
        run: google-chrome --version
      - name: Start local CAD app without triggering Vercel
        shell: bash
        run: |
          nohup npm run dev -- --hostname 127.0.0.1 --port 3127 > /tmp/hsyncad-dev.log 2>&1 &
          echo $! > /tmp/hsyncad-server.pid
          for i in $(seq 1 90); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:3127/kategori/araclar/hsyncad > /dev/null; then
              echo "hsynCAD dev server responding"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/hsyncad-dev.log
          exit 1
      - name: Chromium CAD full regression (desktop/mobile)
        env:
          HSYNCAD_TEST_URL: "http://127.0.0.1:3127"
          HSYNCAD_BROWSER_CHANNEL: "chrome"
        run: npx playwright test --config=playwright.hsyncad.config.ts
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsyncad-viewport-gate-${{ github.sha }}
          path: |
            test-results/hsyncad/
            /tmp/hsyncad-dev.log
          if-no-files-found: ignore
