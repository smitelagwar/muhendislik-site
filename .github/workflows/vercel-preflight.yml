name: vercel-preflight

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve lint baseline
        id: lint-base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            echo "base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
            else
              echo "base=HEAD^" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Lint changed source files
        shell: bash
        run: |
          BASE="${{ steps.lint-base.outputs.base }}"
          mapfile -t FILES < <(
            git diff --name-only --diff-filter=ACMR "$BASE"...HEAD \
              | grep -E '\.(js|jsx|ts|tsx|mjs|cjs)$' \
              || true
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed JavaScript/TypeScript files to lint."
            exit 0
          fi
          printf 'Linting changed files:\n - %s\n' "${FILES[@]}"
          npx eslint "${FILES[@]}"

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Build
        run: npm run build
