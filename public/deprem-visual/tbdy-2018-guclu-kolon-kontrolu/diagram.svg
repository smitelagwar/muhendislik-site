<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title>Güçlü kolon açıklama şeması</title><desc>Güçlü kolon açıklama şeması</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#12A9C6" /></marker><marker id="arrowN" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#123B63" /></marker><style>.bg{fill:#FFFFFF}.panel{fill:#F8FBFC;stroke:#DDE8EE;stroke-width:2;rx:28}.frame{fill:none;stroke:#123B63;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#123B63;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.cyan{fill:none;stroke:#12A9C6;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.cyanThin{fill:none;stroke:#12A9C6;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.solidN{fill:#123B63}.solidC{fill:#12A9C6}.softC{fill:#E8F8FB;stroke:#12A9C6;stroke-width:3}.softN{fill:#EEF4F7;stroke:#123B63;stroke-width:3}.txt{font-family:Arial,Helvetica,sans-serif;fill:#19324a;font-size:34px;font-weight:600}.small{font-family:Arial,Helvetica,sans-serif;fill:#19324a;font-size:26px;font-weight:600}.tiny{font-family:Arial,Helvetica,sans-serif;fill:#19324a;font-size:22px;font-weight:500}.label{font-family:Arial,Helvetica,sans-serif;fill:#123B63;font-size:26px;font-weight:700}.cap{font-family:Arial,Helvetica,sans-serif;fill:#123B63;font-size:44px;font-weight:700}.muted{stroke:#93A8B8;stroke-width:3;fill:none;stroke-dasharray:8 8}.warn{fill:#C74F4F;stroke:#C74F4F;stroke-width:3}</style></defs><rect class="bg" x="0" y="0" width="1600" height="900"/><text x="125" y="120" class="cap">Birleşim Kontrol Mantığı</text><rect x="90" y="260" width="360" height="200" class="panel"/><text x="116" y="310" class="txt">Kolon Kapasitesi</text><text x="116" y="352" class="tiny">Alt + üst kolon uç kapasiteleri</text><rect x="620" y="260" width="360" height="200" class="panel"/><text x="646" y="310" class="txt">Karşılaştırma</text><text x="646" y="352" class="tiny">Birleşim düzeyinde kapasite kontrolü</text><rect x="1150" y="260" width="360" height="200" class="panel"/><text x="1176" y="310" class="txt">Kiriş Kapasitesi</text><text x="1176" y="352" class="tiny">Sol + sağ kiriş uç kapasiteleri</text><line x1="450" y1="360" x2="620" y2="360" class="cyanThin" marker-end="url(#arrow)"/><line x1="1150" y1="360" x2="980" y2="360" class="cyanThin" marker-end="url(#arrow)"/><rect x="575" y="560" width="450" height="170" class="softN" rx="22"/><text x="640" y="630" class="txt">Birleşim Kontrolü</text><text x="640" y="675" class="small">Kolon baskın ise kat mekanizması riski azalır</text></svg>