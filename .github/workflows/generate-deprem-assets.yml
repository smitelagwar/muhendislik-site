name: Generate deprem visual assets

on:
  push:
    branches:
      - deprem-assets-generate

permissions:
  contents: write

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout generator branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve generator
        shell: bash
        run: cp scripts/generate-deprem-visual-assets.py /tmp/generate-deprem-visual-assets.py

      - name: Generate and commit assets on main
        shell: bash
        run: |
          set -u
          git fetch origin main
          git checkout -B main origin/main
          python /tmp/generate-deprem-visual-assets.py "$PWD" > /tmp/generator.log 2>&1
          STATUS=$?
          cat /tmp/generator.log
          if [ "$STATUS" -ne 0 ]; then
            git fetch origin deprem-assets-generate
            git checkout -B deprem-assets-generate origin/deprem-assets-generate
            mkdir -p .tmp
            cp /tmp/generator.log .tmp/generator-error.log
            git add .tmp/generator-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(deprem-visual): record generator failure"
            git push origin HEAD:deprem-assets-generate
            exit "$STATUS"
          fi
          set -e
          git add public/deprem-visual
          TARGET_COUNT="$(find public/deprem-visual -type f -name '*.svg' | wc -l | tr -d ' ')"
          test "$TARGET_COUNT" -ge 286
          CHANGED_COUNT="$(git diff --cached --name-only | grep '^public/deprem-visual/.*\.svg$' | wc -l | tr -d ' ')"
          echo "Changed SVG files: $CHANGED_COUNT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No asset changes required."
            exit 0
          fi
          git commit -m "feat(deprem-visual): add remaining non-TS500 visual assets"
          git push origin main
