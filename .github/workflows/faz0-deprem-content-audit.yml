name: FAZ 0 Deprem Content Snapshot

on:
  push:
    branches:
      - audit/faz0-deprem-inventory-20260825

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/faz0-deprem-inventory-20260825
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate inventory snapshot
        run: npx tsx scripts/generate-deprem-content-inventory.ts --out=deprem-content-inventory.json
      - name: Commit snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deprem-content-inventory.json
          if git diff --cached --quiet; then
            echo "Inventory snapshot is unchanged."
            exit 0
          fi
          git commit -m "chore(audit): snapshot FAZ 0 deprem inventory [skip ci]"
          git push origin HEAD:audit/faz0-deprem-inventory-20260825
