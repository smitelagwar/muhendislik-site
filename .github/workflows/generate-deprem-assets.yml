name: Deprem visual final QA

on:
  push:
    branches:
      - deprem-assets-generate

permissions:
  contents: read

jobs:
  final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deprem content gate
        id: content
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check:deprem-content 2>&1 | tee /tmp/deprem-content.log

      - name: Full deprem release gate
        id: release
        if: steps.content.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check:deprem-release 2>&1 | tee /tmp/deprem-release.log

      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deprem-final-qa-logs
          path: |
            /tmp/deprem-content.log
            /tmp/deprem-release.log
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce QA result
        if: steps.content.outcome == 'failure' || steps.release.outcome == 'failure'
        run: exit 1
