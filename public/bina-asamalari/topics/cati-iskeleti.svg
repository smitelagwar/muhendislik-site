<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090619"/><stop offset="0.52" stop-color="#24104d"/><stop offset="1" stop-color="#070a15"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#261467"/><stop offset="0.62" stop-color="#100b2e"/><stop offset="1" stop-color="#090812"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2e8f0"/><stop offset="0.45" stop-color="#64748b"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
  <linearGradient id="timber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c68b48"/><stop offset="1" stop-color="#5b341d"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect width="1200" height="390" fill="url(#sky)"/>
<circle cx="955" cy="108" r="48" fill="#a78bfa" opacity=".18" filter="url(#glow)"/>
<g opacity=".42" fill="#111827"><rect x="0" y="250" width="110" height="155"/><rect x="90" y="205" width="95" height="200"/><rect x="180" y="270" width="125" height="135"/><rect x="1010" y="220" width="90" height="185"/><rect x="1090" y="175" width="110" height="230"/></g>
<g opacity=".75" stroke="#7c3aed" stroke-width="3"><line x1="70" y1="350" x2="1120" y2="350"/><line x1="70" y1="354" x2="1120" y2="354"/></g>
<!-- crane -->
<g stroke="#d6a14c" fill="none" opacity=".82"><line x1="190" y1="80" x2="190" y2="350" stroke-width="12"/><line x1="190" y1="90" x2="670" y2="90" stroke-width="8"/><line x1="190" y1="90" x2="95" y2="125" stroke-width="7"/><line x1="260" y1="90" x2="260" y2="190" stroke-width="3"/><line x1="250" y1="190" x2="270" y2="190" stroke-width="4"/></g>
<!-- concrete ring beam -->
<polygon points="145,515 995,515 1060,560 210,560" fill="#4b5563" stroke="#94a3b8" stroke-width="3"/>
<!-- vertical columns -->
<g fill="url(#steel)" stroke="#cbd5e1" stroke-width="2"><rect x="205" y="365" width="26" height="170"/><rect x="398" y="365" width="26" height="170"/><rect x="590" y="365" width="26" height="170"/><rect x="782" y="365" width="26" height="170"/><rect x="972" y="365" width="26" height="170"/></g>
<!-- main steel roof trusses -->
<g stroke="url(#steel)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
 <path d="M210 365 L360 240 L410 365"/><path d="M400 365 L550 240 L605 365"/><path d="M590 365 L740 240 L800 365"/><path d="M780 365 L930 240 L995 365"/>
</g>
<!-- web members -->
<g stroke="#c4b5fd" stroke-width="4" opacity=".9"><path d="M210 365 L285 302 L360 365 L410 365 L360 240" fill="none"/><path d="M400 365 L475 302 L550 365 L605 365 L550 240" fill="none"/><path d="M590 365 L665 302 L740 365 L800 365 L740 240" fill="none"/><path d="M780 365 L855 302 L930 365 L995 365 L930 240" fill="none"/></g>
<!-- purlins -->
<g stroke="url(#timber)" stroke-width="9" opacity=".96"><line x1="284" y1="301" x2="855" y2="301"/><line x1="322" y1="270" x2="892" y2="270"/><line x1="360" y1="240" x2="930" y2="240"/><line x1="245" y1="334" x2="820" y2="334"/></g>
<!-- braces -->
<g stroke="#a78bfa" stroke-width="5" opacity=".7"><line x1="225" y1="520" x2="410" y2="365"/><line x1="410" y1="520" x2="595" y2="365"/><line x1="600" y1="520" x2="790" y2="365"/><line x1="790" y1="520" x2="985" y2="365"/></g>
<!-- foreground work lights -->
<g fill="#f8fafc" filter="url(#glow)"><circle cx="120" cy="500" r="9"/><circle cx="1090" cy="470" r="9"/></g>
<g fill="#f59e0b" opacity=".9"><rect x="110" y="512" width="20" height="70"/><rect x="1080" y="482" width="20" height="90"/></g>
<!-- subtle blueprint lines -->
<g opacity=".14" stroke="#c4b5fd" stroke-width="1"><path d="M0 610 H1200"/><path d="M0 640 H1200"/><path d="M100 0 V675"/><path d="M1100 0 V675"/></g>
</svg>