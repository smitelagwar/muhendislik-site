name: Deprem Visual Master Final

on:
  push:
    branches: [main]
    paths:
      - "public/deprem-visual/**"
      - "src/lib/ts500-content/**"
      - "src/lib/ts500-visual-rollout.ts"
      - "scripts/check-deprem-visual-master-final.ts"
      - ".github/workflows/deprem-visual-master-final.yml"

permissions:
  contents: read

jobs:
  master-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Master 164 topic / 328 asset QA
        run: npx tsx scripts/check-deprem-visual-master-final.ts
      - name: Deprem phase 8
        run: npm run check:deprem-phase8
      - name: Deprem content
        run: npm run check:deprem-content
      - name: Content quality
        run: npm run check:content-quality
      - name: Site quality
        run: npm run check:site-quality
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Production build
        run: npm run build
      - name: Navigation
        run: npm run check:navigation
      - name: Visual system
        run: npm run check:visual-system
      - name: Smoke test
        run: npm run check:smoke
      - name: Deprem phase 9
        run: npm run check:deprem-phase9
